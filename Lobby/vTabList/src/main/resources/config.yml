# Intervalo de atualização da tablist em ticks (20 ticks = 1 segundo)
update-interval: 1

# Ordem dos grupos para exibição
group-order:
  - "owner"
  - "ceo"
  - "moderator"
  - "vip"
  - "default"

# Configurações do header
header:
  enabled: true
  lines:
    line1:
      texts:
        - "&c&lDᴇᴇᴘ&f&lCʀᴀꜰᴛ"
      animation-interval: 20
    line2:
      texts:
        - "&7Jogadores no Lobby: &a%server_online%"
      animation-interval: 20
    line3:
      texts:
        - " "
      animation-interval: 20
    line4:
      texts:
        - "&eBem-vindo &a%player_name%"
      animation-interval: 20
    line5:
      texts:
        - ""
      animation-interval: 10

# Configurações do footer
footer:
  enabled: true
  lines:
    line1:
      texts:
        - " "
      animation-interval: 20
    line2:
      texts:
        - "&d&lBᴏᴍ Jᴏɢᴏ!"
      animation-interval: 1