name: vLobby
version: 3.2.17
main: com.vitor.vLobby
api-version: "1.21"
author: Vitor
description: "Advanced lobby management system with teleport bows, interactive menus, portal NPCs, and biome control"
depend: [LuckPerms]

commands:
  lobbymenu:
    description: "Opens the server selection menu"
    usage: "/lobbymenu"
  vlb:
    description: "Main administration command for vLobby"
    usage: "/vlb [reload|version]"
    aliases: [vlobby, vlobbymenu]
    permission: vl.admin
  setbiome:
    description: "Changes biomes in specified areas"
    usage: "/setbiome <world> <biome> <x1> <y1> <z1> <x2> <y2> <z2>"
    aliases: [vsetbiome]
    permission: vl.admin

permissions:
  vl.staff:
    description: "Staff permission for creative mode in lobby"
    default: op
  vl.admin:
    description: "Full administration access to vLobby features"
    default: op
  vl.user:
    description: "Basic user permissions for lobby features"
    default: true